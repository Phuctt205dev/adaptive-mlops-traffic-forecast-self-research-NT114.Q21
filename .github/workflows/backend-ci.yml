name: 01 Application Delivery
run-name: "Release #${{ github.run_number }} | ${{ github.event_name }} | ${{ github.head_ref || github.ref_name }}"

on:
  pull_request:
    # Required acceptance must exist even for a documentation-only PR.
    # Expensive work is selected below from the PR diff, never CD state.
    branches: [main, master]
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'src/**'
      - 'app.py'
      - 'tests/**'
      - 'scripts/**'
      - 'deployment/**'
      - 'requirements/**'
      - 'alembic/**'
      - 'frontend/**'
      - 'docs/index.html'
      - '.github/workflows/frontend-ci.yml'
      - '.github/workflows/deploy-frontend-pages.yml'
      - '.github/workflows/backend-*.yml'
      - '.github/workflows/cd-*.yml'
  workflow_dispatch:
  schedule:
    # Weekly full validation only; deployment jobs accept push events only.
    - cron: '17 20 * * 0'

permissions:
  contents: read

# CI jobs cancel obsolete work individually. Never cancel the whole run once
# its reusable backend delivery has acquired the production transaction.

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
      current: ${{ steps.scope.outputs.current }}
      backend: ${{ steps.scope.outputs.backend }}
      tests: ${{ steps.scope.outputs.tests }}
      frontend: ${{ steps.scope.outputs.frontend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Classify accumulated changes from verified production
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          FRONTEND_API_URL: ${{ vars.VITE_API_BASE_URL }}
          FRONTEND_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python -B scripts/cicd/pipeline.py scope
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-scope-${{ github.sha }}
          overwrite: true
          path: ci-scope.json
          if-no-files-found: error
          retention-days: 30

  tests:
    needs: scope
    if: needs.scope.outputs.tests == 'true'
    concurrency:
      group: checks-${{ github.ref }}-${{ github.event_name }}-tests
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DATABASE_URL: sqlite://
      AWS_EC2_METADATA_DISABLED: 'true'
      MPLBACKEND: Agg
      CUDA_VISIBLE_DEVICES: '-1'
      TF_CPP_MIN_LOG_LEVEL: '3'
      OMP_NUM_THREADS: '1'
      TF_NUM_INTEROP_THREADS: '1'
      TF_NUM_INTRAOP_THREADS: '1'
      MLFLOW_TRACKING_URI: sqlite:////tmp/traffic-ci-mlflow.db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements/ci.txt
            requirements/backend.txt
            requirements/roles/constraints.txt
      - name: Install test dependencies
        run: python -m pip install -c requirements/roles/constraints.txt -r requirements/ci.txt
      - name: Backend, ML and delivery regression tests
        run: python -B -m unittest discover -s tests -v
      - name: Build and verify release from tracked sources
        run: python -B scripts/cicd/release.py Build --roles --directory release --commit "$GITHUB_SHA"
      - name: Produce offline model compatibility fixtures
        run: python -B scripts/cicd/role_checks.py fixtures --directory fixtures
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-model-fixtures-${{ github.sha }}
          overwrite: true
          path: fixtures/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checked-source-${{ github.sha }}
          overwrite: true
          path: release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  image:
    needs: [scope, tests]
    # A manual full check may target a branch. Deployment still requires a
    # default-branch push in the separate backend/Pages caller conditions.
    if: >-
      github.event_name != 'pull_request' && needs.scope.outputs.backend == 'true' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch')
    concurrency:
      group: checks-${{ github.ref }}-${{ github.event_name }}-image-${{ matrix.role }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        role: [api, tree, neural, sync]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: checked-source-${{ github.sha }}
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: offline-model-fixtures-${{ github.sha }}
          path: fixtures
      - name: Verify source and check reusable content image
        id: metadata
        env:
          ROLE: ${{ matrix.role }}
        run: |
          python -B scripts/cicd/release.py Verify --directory release --commit "$GITHUB_SHA"
          python - <<'PY'
          import json,os,pathlib
          from scripts.cicd.role_registry import lookup
          role=os.environ['ROLE']; image='ghcr.io/'+os.environ['GITHUB_REPOSITORY'].lower()+'/backend'
          source=json.loads(pathlib.Path('release/release.json').read_text())['roles'][role]['source_id']
          binding=lookup(image,role,source)
          ref=binding['image'] if binding else image+':'+role+'-'+source
          pathlib.Path('image-'+role+'.json').write_text(json.dumps(binding))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('reusable='+str(binding is not None).lower()+'\nimage='+image+'\nsource_id='+source+'\nref='+ref+'\n')
          PY
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.metadata.outputs.reusable != 'true'
        with:
          context: release
          target: ${{ matrix.role }}
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.ref }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            traffic.role=${{ matrix.role }}
            traffic.source-id=${{ steps.metadata.outputs.source_id }}
          cache-from: type=gha,scope=role-${{ matrix.role }}
          cache-to: type=gha,mode=max,scope=role-${{ matrix.role }}
      - name: Pull previously checked immutable image
        if: steps.metadata.outputs.reusable == 'true'
        env:
          IMAGE: ${{ steps.metadata.outputs.ref }}
        run: docker pull "$IMAGE"
      - name: Check image boundary and five-model artifact compatibility offline
        env:
          IMAGE: ${{ steps.metadata.outputs.ref }}
        run: |
          docker run --rm --network none --cpus 2 --memory 5g \
            -e DATABASE_URL=sqlite:// -e AWS_EC2_METADATA_DISABLED=true \
            -e MINIO_ROOT_USER=offline -e MINIO_ROOT_PASSWORD=offline \
            -e INTERNAL_TRAINING_TOKEN=offline-image-check -e AUTH_SECRET_KEY=offline-image-check \
            -e TRAFFIC_API_RUNTIME_BUCKET=offline -e CLOUD_TRAINING_ENABLED=true \
            -e KAGGLE_USERNAME=offline -e CUDA_VISIBLE_DEVICES=-1 -e TF_CPP_MIN_LOG_LEVEL=3 \
            -e OMP_NUM_THREADS=1 -e TF_NUM_INTEROP_THREADS=1 -e TF_NUM_INTRAOP_THREADS=1 \
            -v "$PWD/scripts/cicd/role_checks.py:/check.py:ro" -v "$PWD/fixtures:/fixtures:ro" \
            "$IMAGE" python -B /check.py check --directory /fixtures
      - name: Publish only after image checks pass
        if: steps.metadata.outputs.reusable != 'true'
        env:
          IMAGE: ${{ steps.metadata.outputs.ref }}
        run: docker push "$IMAGE"
      - name: Bind verified registry digest
        env:
          ROLE: ${{ matrix.role }}
          IMAGE: ${{ steps.metadata.outputs.image }}
          SOURCE_ID: ${{ steps.metadata.outputs.source_id }}
        run: |
          python - <<'PY'
          import json,os,pathlib,time
          from scripts.cicd.role_registry import lookup
          value=None
          for retry in range(6):
              value=lookup(os.environ['IMAGE'],os.environ['ROLE'],os.environ['SOURCE_ID'])
              if value: break
              time.sleep(2)
          if value is None: raise RuntimeError('Published digest was not confirmed')
          pathlib.Path('image-'+os.environ['ROLE']+'.json').write_text(json.dumps(value))
          PY
      - name: Summarize this role image decision
        env:
          ROLE: ${{ matrix.role }}
          REUSED: ${{ steps.metadata.outputs.reusable }}
          SOURCE_ID: ${{ steps.metadata.outputs.source_id }}
        run: |
          python - <<'PY'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('## Image '+os.environ['ROLE']+'\n\nAction: **'+('Reuse' if os.environ['REUSED']=='true' else 'Build')+'**\n\nSource ID: `'+os.environ['SOURCE_ID']+'`\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: role-image-${{ matrix.role }}-${{ github.sha }}
          overwrite: true
          path: image-${{ matrix.role }}.json
          if-no-files-found: error
          retention-days: 7

  package:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: checked-source-${{ github.sha }}
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: role-image-*-${{ github.sha }}
          path: bindings
      - name: Bind all checked role images to this release
        run: python -B scripts/cicd/bind_roles.py --directory release --bindings bindings --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-release-${{ github.sha }}
          overwrite: true
          path: release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  current-runtime:
    needs: [package, scope]
    if: needs.scope.outputs.current == 'true'
    concurrency:
      group: checks-${{ github.ref }}-${{ github.event_name }}-current
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    # Six balanced safety cases; manifest/no-op cycles are consolidated.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-release-${{ github.sha }}
          path: checked-release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: offline-model-fixtures-${{ github.sha }}
          path: offline-fixtures
      - name: Reserve disk on the disposable hosted runner
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          # These SDKs are unused by this Linux/Python test. This step is never
          # run on the Windows deployment runner or a production node.
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h "$RUNNER_TEMP"
      - name: Install verified kind and create the isolated Kubernetes 1.36 cluster
        env:
          KUBECONFIG: ${{ runner.temp }}/cd-e2e.kubeconfig
        run: |
          python -B scripts/cicd/kind_tool.py
          "$RUNNER_TEMP/kind" create cluster --name cd-e2e --wait 180s \
            --image kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed \
            --config tests/integration/kind.yaml --kubeconfig "$KUBECONFIG"
      - name: Exercise real rollout, cache acknowledgement and recovery on fixtures
        env:
          KUBECONFIG: ${{ runner.temp }}/cd-e2e.kubeconfig
        run: |
          python -B tests/integration/cluster_delivery.py --kubeconfig "$KUBECONFIG" \
            --release checked-release --fixtures offline-fixtures --suite current
      - name: Preserve only sanitized integration facts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isolated-current-proof-${{ github.sha }}
          overwrite: true
          path: |
            results/cicd/kubernetes-delivery-proof.json
            results/cicd/kubernetes-delivery-progress.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove only the disposable test cluster
        if: always()
        run: |
          if [ -x "$RUNNER_TEMP/kind" ]; then
            "$RUNNER_TEMP/kind" delete cluster --name cd-e2e
          fi

  legacy-migration:
    needs: [package, scope]
    if: needs.scope.outputs.full == 'true'
    concurrency:
      group: checks-${{ github.ref }}-${{ github.event_name }}-migration
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    # The real legacy migration took ~20 minutes before the recovery cases.
    # Keep production grace/drain; only the three legacy-specific cases run here.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-release-${{ github.sha }}
          path: checked-release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: offline-model-fixtures-${{ github.sha }}
          path: offline-fixtures
      - name: Reserve disk on the disposable hosted runner
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          # These SDKs are unused by this Linux/Python test. This step is never
          # run on the Windows deployment runner or a production node.
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h "$RUNNER_TEMP"
      - name: Install verified kind and create the isolated Kubernetes 1.36 cluster
        env:
          KUBECONFIG: ${{ runner.temp }}/cd-e2e.kubeconfig
        run: |
          python -B scripts/cicd/kind_tool.py
          "$RUNNER_TEMP/kind" create cluster --name cd-e2e --wait 180s \
            --image kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed \
            --config tests/integration/kind.yaml --kubeconfig "$KUBECONFIG"
      - name: Exercise real rollout, cache acknowledgement and recovery on fixtures
        env:
          KUBECONFIG: ${{ runner.temp }}/cd-e2e.kubeconfig
        run: |
          python -B tests/integration/cluster_delivery.py --kubeconfig "$KUBECONFIG" \
            --release checked-release --fixtures offline-fixtures --suite migration
      - name: Preserve only sanitized integration facts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isolated-migration-proof-${{ github.sha }}
          overwrite: true
          path: |
            results/cicd/kubernetes-delivery-proof.json
            results/cicd/kubernetes-delivery-progress.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove only the disposable test cluster
        if: always()
        run: |
          if [ -x "$RUNNER_TEMP/kind" ]; then
            "$RUNNER_TEMP/kind" delete cluster --name cd-e2e
          fi

  acceptance:
    if: always()
    needs: [scope, tests, frontend-build, image, package, current-runtime, legacy-migration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-scope-${{ github.sha }}
          path: coverage
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: github.event_name != 'pull_request' && needs.scope.outputs.backend == 'true'
        with:
          name: backend-release-${{ github.sha }}
          path: coverage/release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: github.event_name != 'pull_request' && needs.scope.outputs.current == 'true'
        with:
          name: isolated-current-proof-${{ github.sha }}
          path: coverage/current
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: github.event_name != 'pull_request' && needs.scope.outputs.full == 'true'
        with:
          name: isolated-migration-proof-${{ github.sha }}
          path: coverage/migration
      - name: Require complete coverage for this commit and attempt
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python -B scripts/cicd/pipeline.py accept
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: ci-acceptance-${{ github.sha }}
          overwrite: true
          path: coverage/ci-acceptance.json
          if-no-files-found: error
          retention-days: 30

  frontend-build:
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    concurrency:
      group: checks-${{ github.ref }}-${{ github.event_name }}-frontend
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Bind build configuration before compiling
        env:
          FRONTEND_API_URL: ${{ vars.VITE_API_BASE_URL }}
          FRONTEND_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
        run: python -B scripts/cicd/pipeline.py frontend-config
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Bind exact files, source, configuration and CI attempt
        run: python -B scripts/cicd/pipeline.py frontend-manifest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-build-${{ github.sha }}
          overwrite: true
          include-hidden-files: true
          path: |
            frontend/dist/
            frontend/frontend-build.json
          if-no-files-found: error
          retention-days: 30
      - name: Download the uploaded frontend for verification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-build-${{ github.sha }}
          path: frontend-checked
      - name: Verify uploaded files before accepting the build
        run: python -B scripts/cicd/pipeline.py frontend-verify

  backend-delivery:
    needs: [scope, acceptance]
    if: >-
      always() && !cancelled() && needs.acceptance.result == 'success' &&
      needs.scope.outputs.backend == 'true' && github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.RKE2_CD_ENABLED == 'true'
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/backend-deploy.yml
    with:
      ci_run_id: ${{ github.run_id }}
      source_sha: ${{ github.sha }}
      source_attempt: ${{ github.run_attempt }}
      current_run: true
    secrets: inherit

  frontend-publication:
    needs: [scope, acceptance, backend-delivery]
    if: >-
      always() && !cancelled() && needs.acceptance.result == 'success' &&
      needs.scope.outputs.frontend == 'true' && github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (needs.scope.outputs.backend != 'true' || needs.backend-delivery.outputs.outcome == 'success')
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-frontend-pages.yml
    with:
      source_sha: ${{ github.sha }}
      artifact_run_id: ${{ github.run_id }}
    secrets: inherit

  summary:
    if: always()
    needs: [scope, tests, frontend-build, image, package, current-runtime, legacy-migration, acceptance, backend-delivery, frontend-publication]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        continue-on-error: true
        with:
          persist-credentials: false
      - name: Summarize this application release
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json,os
          results=json.loads(os.environ['RESULTS'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('## Application release\n\nCandidate source: `'+os.environ['GITHUB_SHA']+'`\n\n')
              out.write('| Stage | Result |\n| --- | --- |\n')
              for name,value in results.items(): out.write('| '+name+' | '+value['result']+' |\n')
              backend=results['backend-delivery']
              pages=results['frontend-publication']
              out.write('\nBackend outcome: **'+(backend.get('outputs',{}).get('outcome') or backend['result'])+'**\n')
              out.write('\nPages published: **'+pages.get('outputs',{}).get('published','not run')+'**; '+pages.get('outputs',{}).get('reason','see stage result')+'\n')
              out.write('\nBuild and deployment decisions are separate. Read image summaries and the backend receipt for per-role Deploy/Keep decisions and recovery.\n')
          PY
      - name: Download scope for measurements
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-scope-${{ github.sha }}
          path: metrics-input/scope
      - name: Download acceptance for measurements
        if: github.event_name != 'pull_request' && needs.acceptance.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-acceptance-${{ github.sha }}
          path: metrics-input/acceptance
      - name: Download receipt for measurements
        if: needs.backend-delivery.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: delivery-receipt-${{ github.sha }}-${{ github.run_attempt }}
          path: metrics-input/receipt
      - name: Measure CI and actual delivery evidence
        id: measurements
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BENCHMARK_EXPERIMENT: ${{ vars.CI_BENCHMARK_EXPERIMENT }}
          BENCHMARK_WORKLOAD: ${{ vars.CI_BENCHMARK_WORKLOAD }}
          BENCHMARK_CACHE_STATE: ${{ vars.CI_BENCHMARK_CACHE_STATE }}
          BENCHMARK_RUNNER_PROFILE: ubuntu-24.04
        run: python -B scripts/cicd/benchmark.py collect
      - name: Mark unavailable measurements explicitly
        if: steps.measurements.outcome == 'failure'
        run: echo 'CI/CD measurements unavailable; inspect the collector step. Deployment results above remain authoritative.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve measurements
        if: steps.measurements.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: delivery-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery-metrics/
          overwrite: true
          if-no-files-found: error
          retention-days: 30
