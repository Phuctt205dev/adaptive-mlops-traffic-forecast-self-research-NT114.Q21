name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'src/**'
      - 'app.py'
      - 'tests/**'
      - 'scripts/**'
      - 'deployment/**'
      - 'requirements/**'
      - 'alembic/**'
      - '.github/workflows/backend-*.yml'
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'src/**'
      - 'app.py'
      - 'tests/**'
      - 'scripts/**'
      - 'deployment/**'
      - 'requirements/**'
      - 'alembic/**'
      - '.github/workflows/backend-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DATABASE_URL: sqlite://
      AWS_EC2_METADATA_DISABLED: 'true'
      MPLBACKEND: Agg
      CUDA_VISIBLE_DEVICES: '-1'
      TF_CPP_MIN_LOG_LEVEL: '3'
      OMP_NUM_THREADS: '1'
      TF_NUM_INTEROP_THREADS: '1'
      TF_NUM_INTRAOP_THREADS: '1'
      MLFLOW_TRACKING_URI: sqlite:////tmp/traffic-ci-mlflow.db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements/ci.txt
      - name: Backend, ML and delivery regression tests
        run: python -B -m unittest discover -s tests -v
      - name: Build and verify release from tracked sources
        run: python -B scripts/cicd/release.py Build --directory release --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checked-source-${{ github.sha }}
          path: release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  image:
    needs: tests
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: checked-source-${{ github.sha }}
          path: release
      - name: Verify checked payload and select image name
        id: metadata
        shell: bash
        run: |
          python -B scripts/cicd/release.py Verify --directory release --commit "$GITHUB_SHA"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: release
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Bind image digest to reviewed release
        env:
          RELEASE_IMAGE: ${{ steps.metadata.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          python -c "import json,os,pathlib; p=pathlib.Path('release'); r=json.loads((p/'release.json').read_text()); (p/'delivery.json').write_text(json.dumps({'commit':r['commit'],'release_id':r['release_id'],'image':os.environ['RELEASE_IMAGE']}))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-release-${{ github.sha }}
          path: release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
