name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'src/**'
      - 'app.py'
      - 'tests/**'
      - 'scripts/**'
      - 'deployment/**'
      - 'requirements/**'
      - 'alembic/**'
      - '.github/workflows/backend-*.yml'
      - '.github/workflows/cd-*.yml'
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'src/**'
      - 'app.py'
      - 'tests/**'
      - 'scripts/**'
      - 'deployment/**'
      - 'requirements/**'
      - 'alembic/**'
      - '.github/workflows/backend-*.yml'
      - '.github/workflows/cd-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DATABASE_URL: sqlite://
      AWS_EC2_METADATA_DISABLED: 'true'
      MPLBACKEND: Agg
      CUDA_VISIBLE_DEVICES: '-1'
      TF_CPP_MIN_LOG_LEVEL: '3'
      OMP_NUM_THREADS: '1'
      TF_NUM_INTEROP_THREADS: '1'
      TF_NUM_INTRAOP_THREADS: '1'
      MLFLOW_TRACKING_URI: sqlite:////tmp/traffic-ci-mlflow.db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements/ci.txt
            requirements/roles/constraints.txt
      - name: Install test dependencies
        run: python -m pip install -c requirements/roles/constraints.txt -r requirements/ci.txt
      - name: Backend, ML and delivery regression tests
        run: python -B -m unittest discover -s tests -v
      - name: Build and verify release from tracked sources
        run: python -B scripts/cicd/release.py Build --roles --directory release --commit "$GITHUB_SHA"
      - name: Produce offline model compatibility fixtures
        run: python -B scripts/cicd/role_checks.py fixtures --directory fixtures
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-model-fixtures-${{ github.sha }}
          path: fixtures/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checked-source-${{ github.sha }}
          path: release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  image:
    needs: tests
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        role: [api, tree, neural, sync]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: checked-source-${{ github.sha }}
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: offline-model-fixtures-${{ github.sha }}
          path: fixtures
      - name: Verify source and check reusable content image
        id: metadata
        env:
          ROLE: ${{ matrix.role }}
        run: |
          python -B scripts/cicd/release.py Verify --directory release --commit "$GITHUB_SHA"
          python - <<'PY'
          import json,os,pathlib
          from scripts.cicd.role_registry import lookup
          role=os.environ['ROLE']; image='ghcr.io/'+os.environ['GITHUB_REPOSITORY'].lower()+'/backend'
          source=json.loads(pathlib.Path('release/release.json').read_text())['roles'][role]['source_id']
          binding=lookup(image,role,source)
          ref=binding['image'] if binding else image+':'+role+'-'+source
          pathlib.Path('image-'+role+'.json').write_text(json.dumps(binding))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('reusable='+str(binding is not None).lower()+'\nimage='+image+'\nsource_id='+source+'\nref='+ref+'\n')
          PY
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.metadata.outputs.reusable != 'true'
        with:
          context: release
          target: ${{ matrix.role }}
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.ref }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            traffic.role=${{ matrix.role }}
            traffic.source-id=${{ steps.metadata.outputs.source_id }}
          cache-from: type=gha,scope=role-${{ matrix.role }}
          cache-to: type=gha,mode=max,scope=role-${{ matrix.role }}
      - name: Pull previously checked immutable image
        if: steps.metadata.outputs.reusable == 'true'
        env:
          IMAGE: ${{ steps.metadata.outputs.ref }}
        run: docker pull "$IMAGE"
      - name: Check image boundary and five-model artifact compatibility offline
        env:
          IMAGE: ${{ steps.metadata.outputs.ref }}
        run: |
          docker run --rm --network none --cpus 2 --memory 5g \
            -e DATABASE_URL=sqlite:// -e AWS_EC2_METADATA_DISABLED=true \
            -e MINIO_ROOT_USER=offline -e MINIO_ROOT_PASSWORD=offline \
            -e INTERNAL_TRAINING_TOKEN=offline-image-check -e AUTH_SECRET_KEY=offline-image-check \
            -e TRAFFIC_API_RUNTIME_BUCKET=offline -e CLOUD_TRAINING_ENABLED=true \
            -e KAGGLE_USERNAME=offline -e CUDA_VISIBLE_DEVICES=-1 -e TF_CPP_MIN_LOG_LEVEL=3 \
            -e OMP_NUM_THREADS=1 -e TF_NUM_INTEROP_THREADS=1 -e TF_NUM_INTRAOP_THREADS=1 \
            -v "$PWD/scripts/cicd/role_checks.py:/check.py:ro" -v "$PWD/fixtures:/fixtures:ro" \
            "$IMAGE" python -B /check.py check --directory /fixtures
      - name: Publish only after image checks pass
        if: steps.metadata.outputs.reusable != 'true'
        env:
          IMAGE: ${{ steps.metadata.outputs.ref }}
        run: docker push "$IMAGE"
      - name: Bind verified registry digest
        env:
          ROLE: ${{ matrix.role }}
          IMAGE: ${{ steps.metadata.outputs.image }}
          SOURCE_ID: ${{ steps.metadata.outputs.source_id }}
        run: |
          python - <<'PY'
          import json,os,pathlib,time
          from scripts.cicd.role_registry import lookup
          value=None
          for retry in range(6):
              value=lookup(os.environ['IMAGE'],os.environ['ROLE'],os.environ['SOURCE_ID'])
              if value: break
              time.sleep(2)
          if value is None: raise RuntimeError('Published digest was not confirmed')
          pathlib.Path('image-'+os.environ['ROLE']+'.json').write_text(json.dumps(value))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: role-image-${{ matrix.role }}-${{ github.sha }}
          path: image-${{ matrix.role }}.json
          if-no-files-found: error
          retention-days: 7

  package:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: checked-source-${{ github.sha }}
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: role-image-*-${{ github.sha }}
          path: bindings
      - name: Bind all checked role images to this release
        run: python -B scripts/cicd/bind_roles.py --directory release --bindings bindings --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-release-${{ github.sha }}
          path: release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  isolated-delivery:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-release-${{ github.sha }}
          path: checked-release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: offline-model-fixtures-${{ github.sha }}
          path: offline-fixtures
      - name: Reserve disk on the disposable hosted runner
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          # These SDKs are unused by this Linux/Python test. This step is never
          # run on the Windows deployment runner or a production node.
          sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h "$RUNNER_TEMP"
      - name: Install verified kind and create the isolated Kubernetes 1.36 cluster
        env:
          KUBECONFIG: ${{ runner.temp }}/cd-e2e.kubeconfig
        run: |
          curl --fail --location --retry 3 --max-time 90 \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 \
            --output "$RUNNER_TEMP/kind"
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  $RUNNER_TEMP/kind" | sha256sum --check
          chmod +x "$RUNNER_TEMP/kind"
          "$RUNNER_TEMP/kind" create cluster --name cd-e2e --wait 180s \
            --image kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed \
            --config tests/integration/kind.yaml --kubeconfig "$KUBECONFIG"
      - name: Exercise real rollout, cache acknowledgement and recovery on fixtures
        env:
          KUBECONFIG: ${{ runner.temp }}/cd-e2e.kubeconfig
        run: |
          python -B tests/integration/cluster_delivery.py --kubeconfig "$KUBECONFIG" \
            --release checked-release --fixtures offline-fixtures
      - name: Preserve only sanitized integration facts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isolated-delivery-proof-${{ github.sha }}
          path: results/cicd/kubernetes-delivery-proof.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove only the disposable test cluster
        if: always()
        run: |
          if [ -x "$RUNNER_TEMP/kind" ]; then
            "$RUNNER_TEMP/kind" delete cluster --name cd-e2e
          fi
