name: 91 CD Retry
run-name: "CD Retry #${{ github.run_number }} | ${{ github.event_name }} | Deferred releases"

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: cd-deferred-retry
  cancel-in-progress: false

jobs:
  retry:
    if: vars.RKE2_CD_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          persist-credentials: false
      - name: Retry only an eligible deferred release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/cicd/cd_pending.py
