name: 02 Backend Delivery
run-name: "Backend delivery #${{ github.run_number }} | CI run ${{ inputs.ci_run_id }} | ${{ inputs.operation || 'release' }}"

on:
  workflow_call:
    inputs:
      ci_run_id:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      source_attempt:
        required: true
        type: string
      current_run:
        type: boolean
        default: false
    outputs:
      outcome:
        value: ${{ jobs.record-result.outputs.outcome || jobs.inspect.outputs.reason }}
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Checked default-branch application push run to deliver
        required: true
        type: string
      operation:
        description: Normal release, or the explicitly reviewed one-time runtime migration
        required: true
        default: release
        type: choice
        options: [release, migrate-role-runtime-v1]

permissions:
  contents: read
  actions: read

# Never cancel a deployment halfway through a maintenance transaction.
concurrency:
  group: rke2-production
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      vars.RKE2_CD_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || inputs.current_run)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.provenance.outputs.sha }}
      run_id: ${{ steps.provenance.outputs.run_id }}
      artifact: ${{ steps.provenance.outputs.artifact }}
      mode: ${{ steps.provenance.outputs.mode }}
      epoch: ${{ steps.provenance.outputs.epoch }}
      environment: ${{ steps.provenance.outputs.environment }}
      ci_number: ${{ steps.provenance.outputs.ci_number }}
      ci_attempt: ${{ steps.provenance.outputs.ci_attempt }}
      operation: ${{ steps.provenance.outputs.operation }}
      eligible: ${{ steps.provenance.outputs.eligible }}
      application: ${{ steps.provenance.outputs.application }}
      reason: ${{ steps.provenance.outputs.reason }}
    steps:
      # The validation code comes from the protected default branch, never a PR.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify source run and selected deployment protection
        id: provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CI_TRIGGER_SHA: ${{ inputs.source_sha }}
          CI_TRIGGER_ATTEMPT: ${{ inputs.source_attempt }}
          CURRENT_RUN: ${{ inputs.current_run }}
          DELIVERY_OPERATION: ${{ inputs.operation || 'release' }}
        run: |
          if [ "$CURRENT_RUN" = true ]; then
            python -B scripts/cicd/github_gate.py --run-id "$CI_RUN_ID" --expected-commit "$CI_TRIGGER_SHA" --expected-attempt "$CI_TRIGGER_ATTEMPT" --current-run
          else
            python -B scripts/cicd/github_gate.py --run-id "$CI_RUN_ID"
          fi

  deploy:
    needs: inspect
    if: needs.inspect.outputs.eligible == 'true'
    environment: ${{ needs.inspect.outputs.environment }}
    runs-on: [self-hosted, Windows, X64, rke2-deploy]
    timeout-minutes: 55
    permissions:
      contents: write
      actions: read
    outputs:
      began: ${{ steps.claim.outputs.began }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.inspect.outputs.sha }}
          persist-credentials: false
      - name: Check artifact preparation on Windows with offline fixtures
        shell: powershell
        run: |
          python -B -m unittest tests.test_prepare_artifact
          if ($LASTEXITCODE -ne 0) { throw 'Windows artifact preparation checks failed.' }
      - name: Download and verify the complete release before claiming CD
        id: package
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_CI_RUN: ${{ needs.inspect.outputs.run_id }}
          EXPECTED_COMMIT: ${{ needs.inspect.outputs.sha }}
          CURRENT_RUN: ${{ inputs.current_run }}
        run: |
          $destination = Join-Path $env:RUNNER_TEMP ('traffic-artifact-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          $currentRunArgs = @()
          if ($env:CURRENT_RUN -eq 'true') { $currentRunArgs += '--current-run' }
          python -B scripts/cicd/prepare_artifact.py --run-id $env:SOURCE_CI_RUN --commit $env:EXPECTED_COMMIT --destination $destination @currentRunArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release preparation failed before CD claim.' }
      - name: Claim this deployment under the saved mode
        id: claim
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ needs.inspect.outputs.sha }}
          CI_NUMBER: ${{ needs.inspect.outputs.ci_number }}
          DELIVERY_MODE: ${{ needs.inspect.outputs.mode }}
          CONTROL_EPOCH: ${{ needs.inspect.outputs.epoch }}
          SOURCE_CI_RUN: ${{ needs.inspect.outputs.run_id }}
          SOURCE_CI_ATTEMPT: ${{ needs.inspect.outputs.ci_attempt }}
          DELIVERY_OPERATION: ${{ needs.inspect.outputs.operation }}
          CURRENT_RUN: ${{ inputs.current_run }}
          APPLICATION_RELEASE: ${{ needs.inspect.outputs.application }}
        run: |
          $currentRunArgs = @()
          if ($env:CURRENT_RUN -eq 'true') { $currentRunArgs += '--current-run' }
          $sourceCheck = python -B scripts/cicd/github_gate.py --run-id $env:SOURCE_CI_RUN --expected-commit $env:EXPECTED_COMMIT --expected-attempt $env:SOURCE_CI_ATTEMPT --check-only @currentRunArgs
          if ($LASTEXITCODE -ne 0) { throw 'The selected CI must still be fully successful before CD claim.' }
          if (($sourceCheck | ConvertFrom-Json).eligible -eq $false) {
            [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "began=false`n")
            Write-Output 'Release superseded before claim; no deployment transaction was started.'
            exit 0
          }
          python -B scripts/cicd/cd_state.py begin
          if ($LASTEXITCODE -ne 0) { throw 'Deployment claim failed.' }
      - name: Deliver the approved immutable release
        id: delivery
        if: steps.claim.outputs.began == 'true'
        shell: powershell
        env:
          EXPECTED_COMMIT: ${{ needs.inspect.outputs.sha }}
          RKE2_CONTEXT: ${{ vars.RKE2_CONTEXT }}
          RKE2_NAMESPACE_UID: ${{ vars.RKE2_NAMESPACE_UID }}
          RKE2_KUBECONFIG: ${{ vars.RKE2_KUBECONFIG }}
          RKE2_IMAGE_PULL_SECRET: ${{ vars.RKE2_IMAGE_PULL_SECRET }}
          CI_RUN_ID: ${{ needs.inspect.outputs.run_id }}
          PUBLIC_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          DELIVERY_OPERATION: ${{ needs.inspect.outputs.operation }}
          DELIVERY_MODE: ${{ needs.inspect.outputs.mode }}
          ARTIFACT_DIRECTORY: ${{ steps.package.outputs.artifact_directory }}
        run: ./scripts/cicd/deliver.ps1 -ArtifactDirectory $env:ARTIFACT_DIRECTORY -ExpectedCommit $env:EXPECTED_COMMIT -Operation $env:DELIVERY_OPERATION
      - name: Summarize deployment and recovery separately
        if: always()
        shell: powershell
        env:
          EXPECTED_COMMIT: ${{ needs.inspect.outputs.sha }}
          DELIVERY_OUTCOME: ${{ steps.delivery.conclusion || 'failure' }}
          CLAIM_BEGAN: ${{ steps.claim.outputs.began }}
          CLAIM_OUTCOME: ${{ steps.claim.conclusion }}
        run: python -B scripts/cicd/diagnostics.py --outcome $env:DELIVERY_OUTCOME
      - name: Preserve sanitized deployment receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: delivery-receipt-${{ needs.inspect.outputs.sha }}-${{ github.run_attempt }}
          path: results/cicd/*.json
          if-no-files-found: ignore
          retention-days: 30

  record-result:
    needs: [inspect, deploy]
    if: always() && needs.inspect.result == 'success' && needs.deploy.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      outcome: ${{ steps.finish.outputs.outcome }}
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.inspect.outputs.sha }}
          persist-credentials: false
      - name: Download the sanitized receipt, if the runner could preserve it
        id: receipt
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: delivery-receipt-${{ needs.inspect.outputs.sha }}-${{ github.run_attempt }}
          path: receipt
      - name: Record outcome and block Auto after failure
        id: finish
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ needs.inspect.outputs.sha }}
          CI_NUMBER: ${{ needs.inspect.outputs.ci_number }}
          DELIVERY_MODE: ${{ needs.inspect.outputs.mode }}
          CONTROL_EPOCH: ${{ needs.inspect.outputs.epoch }}
          DELIVERY_RESULT: ${{ needs.deploy.result }}
          DELIVERY_BEGAN: ${{ needs.deploy.outputs.began }}
        run: python -B scripts/cicd/cd_state.py finish --receipt-directory receipt
      - name: Release a dependent frontend only after backend verification
        if: steps.finish.outputs.outcome == 'success' && !inputs.current_run
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ needs.inspect.outputs.sha }}
          FRONTEND_API_URL: ${{ vars.VITE_API_BASE_URL }}
          FRONTEND_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          ARTIFACT_RUN_ID: ${{ needs.inspect.outputs.run_id }}
        run: python -B scripts/cicd/frontend_release.py dispatch --commit "$EXPECTED_COMMIT" --backend-run "$GITHUB_RUN_ID" --artifact-run-id "$ARTIFACT_RUN_ID"
