name: Deploy Backend RKE2

on:
  workflow_run:
    workflows: ['Backend CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful default-branch Backend CI push run to deliver
        required: true
        type: string

permissions:
  contents: read
  actions: read

# Never cancel a deployment halfway through a maintenance transaction.
concurrency:
  group: rke2-production
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      vars.RKE2_CD_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.provenance.outputs.sha }}
      run_id: ${{ steps.provenance.outputs.run_id }}
      artifact: ${{ steps.provenance.outputs.artifact }}
      mode: ${{ steps.provenance.outputs.mode }}
      epoch: ${{ steps.provenance.outputs.epoch }}
      environment: ${{ steps.provenance.outputs.environment }}
      ci_number: ${{ steps.provenance.outputs.ci_number }}
    steps:
      # The validation code comes from the protected default branch, never a PR.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify source run and selected deployment protection
        id: provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ inputs.ci_run_id || github.event.workflow_run.id }}
        run: python -B scripts/cicd/github_gate.py --run-id "$CI_RUN_ID"

  deploy:
    needs: inspect
    environment: ${{ needs.inspect.outputs.environment }}
    runs-on: [self-hosted, Windows, X64, rke2-deploy]
    timeout-minutes: 55
    permissions:
      contents: write
      actions: read
    outputs:
      began: ${{ steps.claim.outputs.began }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.inspect.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.inspect.outputs.artifact }}
          run-id: ${{ needs.inspect.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: delivery-artifact
      - name: Claim this deployment under the saved mode
        id: claim
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ needs.inspect.outputs.sha }}
          CI_NUMBER: ${{ needs.inspect.outputs.ci_number }}
          DELIVERY_MODE: ${{ needs.inspect.outputs.mode }}
          CONTROL_EPOCH: ${{ needs.inspect.outputs.epoch }}
        run: python -B scripts/cicd/cd_state.py begin
      - name: Deliver the approved immutable release
        id: delivery
        if: steps.claim.outputs.began == 'true'
        shell: powershell
        env:
          EXPECTED_COMMIT: ${{ needs.inspect.outputs.sha }}
          RKE2_CONTEXT: ${{ vars.RKE2_CONTEXT }}
          RKE2_NAMESPACE_UID: ${{ vars.RKE2_NAMESPACE_UID }}
          RKE2_KUBECONFIG: ${{ vars.RKE2_KUBECONFIG }}
          RKE2_IMAGE_PULL_SECRET: ${{ vars.RKE2_IMAGE_PULL_SECRET }}
          CI_RUN_ID: ${{ needs.inspect.outputs.run_id }}
          PUBLIC_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: ./scripts/cicd/deliver.ps1 -ArtifactDirectory ./delivery-artifact -ExpectedCommit $env:EXPECTED_COMMIT
      - name: Summarize deployment and recovery separately
        if: always()
        shell: powershell
        env:
          EXPECTED_COMMIT: ${{ needs.inspect.outputs.sha }}
          DELIVERY_OUTCOME: ${{ steps.delivery.conclusion || 'failure' }}
          CLAIM_BEGAN: ${{ steps.claim.outputs.began }}
          CLAIM_OUTCOME: ${{ steps.claim.conclusion }}
        run: python -B scripts/cicd/diagnostics.py --outcome $env:DELIVERY_OUTCOME
      - name: Preserve sanitized deployment receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: delivery-receipt-${{ needs.inspect.outputs.sha }}-${{ github.run_attempt }}
          path: results/cicd/*.json
          if-no-files-found: ignore
          retention-days: 30

  record-result:
    needs: [inspect, deploy]
    if: always() && needs.inspect.result == 'success' && needs.deploy.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          persist-credentials: false
      - name: Download the sanitized receipt, if the runner could preserve it
        id: receipt
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: delivery-receipt-${{ needs.inspect.outputs.sha }}-${{ github.run_attempt }}
          path: receipt
      - name: Record outcome and block Auto after failure
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ needs.inspect.outputs.sha }}
          CI_NUMBER: ${{ needs.inspect.outputs.ci_number }}
          DELIVERY_MODE: ${{ needs.inspect.outputs.mode }}
          CONTROL_EPOCH: ${{ needs.inspect.outputs.epoch }}
          DELIVERY_RESULT: ${{ needs.deploy.result }}
          DELIVERY_BEGAN: ${{ needs.deploy.outputs.began }}
        run: python -B scripts/cicd/cd_state.py finish --receipt-directory receipt
