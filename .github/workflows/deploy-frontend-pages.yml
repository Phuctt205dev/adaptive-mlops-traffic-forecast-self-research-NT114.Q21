name: 04 Publish Checked Frontend

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      artifact_run_id:
        type: string
        required: true
    outputs:
      published:
        value: ${{ jobs.publish.outputs.published }}
      reason:
        value: ${{ jobs.publish.outputs.reason }}
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit of the checked application build
        required: true
        type: string
      artifact_run_id:
        description: Application run which built this frontend (no rebuild)
        required: true
        type: string
      backend_run_id:
        description: Verified backend delivery, when retrying a deferred release
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      published: ${{ steps.deployment.outcome == 'success' }}
      reason: ${{ steps.final.outputs.reason || steps.selected.outputs.reason }}
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Download the already compiled frontend
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-build-${{ inputs.source_sha }}
          path: frontend-checked
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Verify artifact files, CI attempt and backend compatibility
        id: selected
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_RUN: ${{ inputs.artifact_run_id }}
          BACKEND_RUN: ${{ inputs.backend_run_id }}
          FRONTEND_API_URL: ${{ vars.VITE_API_BASE_URL }}
          FRONTEND_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
        run: python -B scripts/cicd/frontend_release.py select-artifact --commit "$SOURCE_SHA" --artifact-run-id "$SOURCE_RUN" --backend-run "$BACKEND_RUN"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: steps.selected.outputs.publish == 'true'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: steps.selected.outputs.publish == 'true'
        with:
          path: frontend-checked/dist
      - name: Recheck immediately before publication
        id: final
        if: steps.selected.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_RUN: ${{ inputs.artifact_run_id }}
          BACKEND_RUN: ${{ inputs.backend_run_id }}
          FRONTEND_API_URL: ${{ vars.VITE_API_BASE_URL }}
          FRONTEND_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
        run: python -B scripts/cicd/frontend_release.py select-artifact --commit "$SOURCE_SHA" --artifact-run-id "$SOURCE_RUN" --backend-run "$BACKEND_RUN"
      - name: Publish the verified artifact
        id: deployment
        if: steps.final.outputs.publish == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Record actual publication
        if: steps.deployment.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          DEPLOYMENT_ID: ${{ steps.final.outputs.deployment_id }}
        run: python -B scripts/cicd/frontend_release.py record --commit "$SOURCE_SHA" --deployment-id "$DEPLOYMENT_ID"
