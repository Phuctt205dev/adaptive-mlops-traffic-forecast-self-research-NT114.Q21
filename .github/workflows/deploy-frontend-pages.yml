name: Deploy Frontend To GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure frontend environment
        shell: bash
        run: |
          api_base_url="${{ vars.VITE_API_BASE_URL }}"
          base_path="${{ vars.VITE_BASE_PATH }}"

          if [ -z "$api_base_url" ]; then
            api_base_url="https://api.example.com/api/v1"
          fi

          if [ -z "$base_path" ]; then
            base_path="/${{ github.event.repository.name }}/"
          fi

          echo "VITE_API_BASE_URL=$api_base_url" >> "$GITHUB_ENV"
          echo "VITE_BASE_PATH=$base_path" >> "$GITHUB_ENV"
          echo "Frontend API: $api_base_url"
          echo "Frontend base path: $base_path"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
