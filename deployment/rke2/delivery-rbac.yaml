# One-time bootstrap, reviewed/applied by the cluster owner. No Secret reads,
# workload pruning, node proxy access or infrastructure deployment permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traffic-delivery
  namespace: traffic-mlops
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: traffic-delivery
  namespace: traffic-mlops
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [traffic-api, traffic-training-tree, traffic-training-worker, airflow-scheduler, airflow-webserver]
    verbs: [patch]
  - apiGroups: ['']
    resources: [pods, pods/log]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [pods/exec]
    verbs: [create, get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: traffic-delivery
  namespace: traffic-mlops
subjects:
  - kind: ServiceAccount
    name: traffic-delivery
    namespace: traffic-mlops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: traffic-delivery
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traffic-delivery-namespace-identity
rules:
  - apiGroups: ['']
    resources: [namespaces]
    resourceNames: [traffic-mlops]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traffic-delivery-namespace-identity
subjects:
  - kind: ServiceAccount
    name: traffic-delivery
    namespace: traffic-mlops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traffic-delivery-namespace-identity
