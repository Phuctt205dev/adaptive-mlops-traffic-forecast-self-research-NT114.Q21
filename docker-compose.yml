version: "3.9"

services:
  traffic-api:
    build: .
    container_name: traffic-mlops-container

    ports:
      - "8000:8000"

    environment:
      MLFLOW_ALLOW_FILE_STORE: "true"
      PYTHONUNBUFFERED: "1"

    volumes:
      - ./models:/app/models
      - ./results:/app/results
      - ./monitoring:/app/monitoring
      - ./mlruns:/app/mlruns
      - ./data_versions:/app/data_versions
      - ./data:/app/data

    restart: unless-stopped


  traffic-drift-worker:
    build: .
    container_name: traffic-drift-worker-container

    command: python -u retrain_job.py

    environment:
      PYTHONUNBUFFERED: "1"
      MLFLOW_ALLOW_FILE_STORE: "true"

      DATA_PATH: "data/TrafficVolumeData.csv"
      MODEL_PATH: "models/best_model.pkl"
      STATE_PATH: "monitoring/drift_state.json"

      # Ngưỡng cứng.
      # Nếu MAE > 700 thì chắc chắn drift.
      MAE_THRESHOLD: "700"

      # Ngưỡng tương đối.
      # Nếu MAE hiện tại > baseline_MAE * 1.5 thì drift.
      DEGRADATION_RATIO: "1.5"

      # Train ban đầu: 3 tháng đầu năm 2013.
      # Lưu ý: INITIAL_TRAIN_END là mốc kết thúc dạng exclusive.
      # Nghĩa là lấy dữ liệu >= 2013-01-01 và < 2013-04-01.
      INITIAL_TRAIN_START: "2013-01-01"
      INITIAL_TRAIN_END: "2013-04-01"

      # Check drift bắt đầu ngay sau train window.
      DRIFT_START_DATE: "2013-04-01"

      # Dataset hiện tại kết thúc 2014-08-08.
      # Để 2014-09-01 cho worker check hết tháng 8.
      DRIFT_END_LIMIT: "2014-09-01"

      # Mỗi lần check 1 tháng lịch.
      CHECK_WINDOW_MONTHS: "1"

      # Rolling train window 3 tháng.
      # Nếu drift ở tháng 4 thì retrain bằng tháng 2,3,4.
      TRAIN_WINDOW_MONTHS: "3"

      # Demo: 30 giây chạy một lần.
      CHECK_INTERVAL_SECONDS: "30"

      RUN_ONCE: "false"

    volumes:
      - ./models:/app/models
      - ./results:/app/results
      - ./monitoring:/app/monitoring
      - ./mlruns:/app/mlruns
      - ./data_versions:/app/data_versions
      - ./data:/app/data

    restart: unless-stopped