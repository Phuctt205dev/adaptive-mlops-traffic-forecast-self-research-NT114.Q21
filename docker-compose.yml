version: "3.9"

services:
  traffic-api:
    build: .
    container_name: traffic-mlops-container

    ports:
      - "8000:8000"

    environment:
      MLFLOW_ALLOW_FILE_STORE: "true"
      PYTHONUNBUFFERED: "1"

    volumes:
      - ./models:/app/models
      - ./results:/app/results
      - ./monitoring:/app/monitoring
      - ./mlruns:/app/mlruns
      - ./data_versions:/app/data_versions
      - ./data:/app/data

    restart: unless-stopped


  traffic-drift-worker:
    build: .
    container_name: traffic-drift-worker-container

    command: python -u retrain_job.py

    environment:
      PYTHONUNBUFFERED: "1"
      MLFLOW_ALLOW_FILE_STORE: "true"

      DATA_PATH: "data/TrafficVolumeData.csv"
      MODEL_PATH: "models/best_model.pkl"
      STATE_PATH: "monitoring/drift_state.json"

      # Ngưỡng cứng.
      # Nếu MAE > 700 thì drift.
      MAE_THRESHOLD: "700"

      # Ngưỡng tương đối.
      # Nếu current MAE > baseline MAE * 1.0 thì drift.
      # Tức là current MAE chỉ cần lớn hơn baseline MAE là tính drift.
      DEGRADATION_RATIO: "1.0"

      # Train ban đầu bằng 12 tháng:
      # 2012-11-01 → 2013-11-01
      # Code hiểu train_end theo dạng exclusive:
      # date_time >= 2012-11-01 và date_time < 2013-11-01.
      INITIAL_TRAIN_START: "2012-11-01"
      INITIAL_TRAIN_END: "2013-11-01"

      # Sau khi train xong 12 tháng đầu, bắt đầu check drift từ tháng 11/2013.
      DRIFT_START_DATE: "2013-11-01"

      # Dataset hiện tại kết thúc khoảng 2014-08-08.
      # Để 2014-09-01 để worker check hết tháng 8/2014.
      DRIFT_END_LIMIT: "2014-09-01"

      # Mỗi lần check 1 tháng lịch.
      CHECK_WINDOW_MONTHS: "1"

      # Rolling train window 12 tháng.
      # Ví dụ:
      # 2012-11-01 → 2013-11-01
      # 2012-12-01 → 2013-12-01
      # 2013-01-01 → 2014-01-01
      TRAIN_WINDOW_MONTHS: "12"

      # Demo: 30 giây chạy một lần.
      CHECK_INTERVAL_SECONDS: "30"

      RUN_ONCE: "false"

    volumes:
      - ./models:/app/models
      - ./results:/app/results
      - ./monitoring:/app/monitoring
      - ./mlruns:/app/mlruns
      - ./data_versions:/app/data_versions
      - ./data:/app/data

    restart: unless-stopped