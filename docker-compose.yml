x-airflow-common: &airflow-common
  image: apache/airflow:2.10.5-python3.11
  environment: &airflow-common-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://traffic:${POSTGRES_PASSWORD:-traffic_dev_password}@postgres:5432/airflow
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-local-airflow-secret-key-change-me}
    AIRFLOW_UID: ${AIRFLOW_UID:-50000}
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    AWS_DEFAULT_REGION: us-east-1
    TRAFFIC_API_URL: http://traffic-api:8000
    INTERNAL_TRAINING_TOKEN: ${INTERNAL_TRAINING_TOKEN:-local-internal-training-token}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traffic_dev_password}
      POSTGRES_DB: postgres
      APP_DB_NAME: traffic_management
      MLFLOW_DB_NAME: mlflow
      AIRFLOW_DB_NAME: airflow
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/traffic-datasets
        mc mb --ignore-existing local/traffic-models
        mc mb --ignore-existing local/mlflow-artifacts
        mc mb --ignore-existing local/dvc-storage
    restart: "no"

  mlflow:
    build:
      context: .
      dockerfile: infra/mlflow/Dockerfile
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql+psycopg2://traffic:${POSTGRES_PASSWORD:-traffic_dev_password}@postgres:5432/mlflow
      - --serve-artifacts
      - --artifacts-destination
      - s3://mlflow-artifacts
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "$${AIRFLOW_ADMIN_USERNAME}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Traffic \
          --lastname Admin \
          --role Admin \
          --email "$${AIRFLOW_ADMIN_EMAIL}" || true
    environment:
      <<: *airflow-common-environment
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"
      interval: 20s
      timeout: 10s
      retries: 10

  traffic-api:
    build:
      context: .
      dockerfile: infra/backend/Dockerfile
    command:
      - /bin/sh
      - -c
      - alembic upgrade head && uvicorn app:app --host 0.0.0.0 --port 8000
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql+psycopg://traffic:${POSTGRES_PASSWORD:-traffic_dev_password}@postgres:5432/traffic_management
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      S3_ENDPOINT_URL: http://minio:9000
      MINIO_HEALTH_URL: http://minio:9000/minio/health/live
      MLFLOW_HEALTH_URL: http://mlflow:5000/health
      DATASET_BUCKET: traffic-datasets
      DATASET_MAX_UPLOAD_BYTES: ${DATASET_MAX_UPLOAD_BYTES:-104857600}
      DATASET_MIN_ROWS: ${DATASET_MIN_ROWS:-4380}
      AIRFLOW_API_URL: http://airflow-webserver:8080/api/v1
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      TRAINING_DAG_ID: traffic_region_training
      INTERNAL_TRAINING_TOKEN: ${INTERNAL_TRAINING_TOKEN:-local-internal-training-token}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-local-dev-auth-secret-change-me}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-20}
      PREDICTION_RATE_LIMIT_PER_MINUTE: ${PREDICTION_RATE_LIMIT_PER_MINUTE:-120}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin123456}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
    volumes:
      - ./models:/app/models
      - ./results:/app/results
      - ./monitoring:/app/monitoring
      - ./mlruns:/app/mlruns
      - ./data_versions:/app/data_versions
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  traffic-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      traffic-api:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - traffic-web-node-modules:/app/node_modules
    restart: unless-stopped

  traffic-drift-worker:
    profiles: ["training"]
    build: .
    command: python -u retrain_job.py
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql+psycopg://traffic:${POSTGRES_PASSWORD:-traffic_dev_password}@postgres:5432/traffic_management
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      AWS_DEFAULT_REGION: us-east-1
      DATA_PATH: data/TrafficVolumeData.csv
      MODEL_PATH: models/best_model.pkl
      MODEL_INFO_PATH: models/best_model_info.json
      CANDIDATE_MODEL_PATH: models/candidate_model.pkl
      CANDIDATE_INFO_PATH: models/candidate_model_info.json
      STATE_PATH: monitoring/drift_state.json
      DRIFT_HISTORY_PATH: monitoring/drift_history.csv
      PROMOTION_HISTORY_PATH: monitoring/promotion_history.csv
      MAE_THRESHOLD: "700"
      BASELINE_HISTORY_WINDOWS: "6"
      MIN_BASELINE_WINDOWS: "3"
      DEGRADATION_RATIO: "1.0"
      MIN_PROMOTION_IMPROVEMENT: "0.05"
      INITIAL_TRAIN_START: "2012-11-01"
      INITIAL_TRAIN_END: "2013-11-01"
      DRIFT_START_DATE: "2013-11-01"
      DRIFT_END_LIMIT: "2014-09-01"
      CHECK_WINDOW_MONTHS: "1"
      TRAIN_WINDOW_MONTHS: "12"
      CHECK_INTERVAL_SECONDS: "30"
      RUN_ONCE: "false"
    depends_on:
      mlflow:
        condition: service_healthy
    volumes:
      - ./models:/app/models
      - ./results:/app/results
      - ./monitoring:/app/monitoring
      - ./mlruns:/app/mlruns
      - ./data_versions:/app/data_versions
      - ./data:/app/data
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  airflow-logs:
  traffic-web-node-modules:
