<!DOCTYPE html>
<html>
<head>
  <title>Traffic Predictor</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      padding-top: 50px;
    }

    .card {
      background: white;
      padding: 30px;
      width: 600px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
    }

    p.subtitle {
      text-align: center;
      color: gray;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    button {
      background: #0077ff;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background: #005fd1;
    }

    #result {
      margin-top: 25px;
      font-size: 22px;
      text-align: center;
      color: green;
      font-weight: bold;
    }

    #error {
      margin-top: 15px;
      font-size: 15px;
      text-align: center;
      color: red;
      font-weight: bold;
    }

    table {
      margin-top: 25px;
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
    }

    th {
      background: #f2f2f2;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Traffic Predictor</h1>

  <p class="subtitle">
    Predict future traffic volume automatically
  </p>

  <label>Select Date & Time</label>
  <input type="datetime-local" id="date_time">

  <button onclick="predict()">
    Predict Traffic
  </button>

  <p id="result"></p>

  <p id="error"></p>

  <div id="featuresTable"></div>
</div>

<script>
async function predict() {

  const dateTime =
    document.getElementById("date_time").value;

  if (!dateTime) {
    alert("Please select date and time");
    return;
  }

  document.getElementById("result").innerText =
    "Predicting...";

  document.getElementById("error").innerText =
    "";

  document.getElementById("featuresTable").innerHTML =
    "";

  const payload = {
    date_time: dateTime
  };

  try {

    const response = await fetch(
      "/predict",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      }
    );

    if (!response.ok) {
      throw new Error(
        "API error: " + response.status
      );
    }

    const data = await response.json();

    document.getElementById("result").innerText =
      "Prediction: " +
      data.prediction +
      " vehicles/hour";

    let html = `
      <table>
        <tr>
          <th>Feature</th>
          <th>Value</th>
        </tr>
    `;

    for (const [key, value] of Object.entries(
      data.features_used
    )) {
      html += `
        <tr>
          <td>${key}</td>
          <td>${value}</td>
        </tr>
      `;
    }

    html += "</table>";

    document.getElementById(
      "featuresTable"
    ).innerHTML = html;

  } catch (error) {

    console.error(error);

    document.getElementById("result").innerText =
      "";

    document.getElementById("error").innerText =
      "Prediction failed. Please check API connection or server logs.";
  }
}
</script>

</body>
</html>
