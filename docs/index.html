<!DOCTYPE html>
<html>
<head>
  <title>Traffic Predictor</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      padding-top: 50px;
    }

    .card {
      background: white;
      padding: 30px;
      width: 420px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
    }

    p.subtitle {
      text-align: center;
      color: gray;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    button {
      background: #0077ff;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background: #005fd1;
    }

    #result {
      margin-top: 25px;
      font-size: 22px;
      text-align: center;
      color: green;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Traffic Predictor</h1>
  <p class="subtitle">
    Predict future traffic volume automatically
  </p>

  <label>Select Date & Time</label>
  <input type="datetime-local" id="date_time">

  <button onclick="predict()">
    Predict Traffic
  </button>

  <p id="result"></p>
</div>

<script>
async function predict() {

  const dateTime =
    document.getElementById("date_time").value;

  if (!dateTime) {
    alert("Please select date and time");
    return;
  }

  const payload = {
    date_time: dateTime
  };

  const response = await fetch(
    "https://traffic-son.duckdns.org/predict",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    }
  );

  const data = await response.json();

  document.getElementById("result").innerText =
    "Prediction: " +
    data.prediction +
    " vehicles/hour";
}
</script>

</body>
</html>
