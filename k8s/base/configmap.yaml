apiVersion: v1
kind: ConfigMap
metadata:
  name: traffic-config
  namespace: traffic-mlops
data:
  AWS_DEFAULT_REGION: us-east-1
  DATASET_BUCKET: traffic-datasets
  DATASET_MAX_UPLOAD_BYTES: "104857600"
  DATASET_MIN_ROWS: "4380"
  DVC_ENABLED: "true"
  DVC_REQUIRED: "false"
  DVC_REMOTE_NAME: minio
  DVC_REMOTE_URL: s3://dvc-storage
  DVC_REMOTE_ENDPOINT: http://minio:9000
  DVC_REPO_ROOT: /app
  DVC_WORKSPACE_DIR: data/dvc_data
  DVC_KEEP_LOCAL_SNAPSHOT: "false"
  ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
  AUTH_RATE_LIMIT_PER_MINUTE: "20"
  PREDICTION_RATE_LIMIT_PER_MINUTE: "120"
  BOOTSTRAP_ADMIN_EMAIL: admin@example.com
  TRAINING_DAG_ID: traffic_region_training
  AIRFLOW_ADMIN_USERNAME: admin
  AIRFLOW_ADMIN_EMAIL: admin@example.com
  VITE_API_BASE_URL: http://localhost:30080/api/v1
  CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173","http://localhost:30073","http://127.0.0.1:30073"]'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: traffic-mlops
data:
  01-create-databases.sh: |
    #!/bin/sh
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      CREATE DATABASE traffic_management;
      CREATE DATABASE mlflow;
      CREATE DATABASE airflow;
    EOSQL
