apiVersion: v1
kind: Service
metadata:
  name: traffic-api
  namespace: traffic-mlops
spec:
  type: NodePort
  selector:
    app: traffic-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: traffic-api-artifacts
  namespace: traffic-mlops
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-api
  namespace: traffic-mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-api
  template:
    metadata:
      labels:
        app: traffic-api
    spec:
      initContainers:
        - name: prepare-artifact-dirs
          image: busybox:1.36
          command:
            - sh
            - -c
            - mkdir -p /mnt/models /mnt/results /mnt/monitoring /mnt/mlruns /mnt/data_versions /mnt/data
          volumeMounts:
            - name: artifacts
              mountPath: /mnt
      containers:
        - name: traffic-api
          image: traffic-api:local
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - alembic upgrade head && uvicorn app:app --host 0.0.0.0 --port 8000
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: traffic-config
            - secretRef:
                name: traffic-secrets
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow:5000
            - name: MLFLOW_S3_ENDPOINT_URL
              value: http://minio:9000
            - name: S3_ENDPOINT_URL
              value: http://minio:9000
            - name: MINIO_HEALTH_URL
              value: http://minio:9000/minio/health/live
            - name: MLFLOW_HEALTH_URL
              value: http://mlflow:5000/health
            - name: AIRFLOW_API_URL
              value: http://airflow-webserver:8080/api/v1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: traffic-secrets
                  key: MINIO_ROOT_USER
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: traffic-secrets
                  key: MINIO_ROOT_PASSWORD
          volumeMounts:
            - name: artifacts
              mountPath: /app/models
              subPath: models
            - name: artifacts
              mountPath: /app/results
              subPath: results
            - name: artifacts
              mountPath: /app/monitoring
              subPath: monitoring
            - name: artifacts
              mountPath: /app/mlruns
              subPath: mlruns
            - name: artifacts
              mountPath: /app/data_versions
              subPath: data_versions
            - name: artifacts
              mountPath: /app/data
              subPath: data
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: traffic-api-artifacts
