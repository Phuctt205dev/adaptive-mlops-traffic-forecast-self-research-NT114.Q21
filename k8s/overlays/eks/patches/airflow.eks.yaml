apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-init
  namespace: traffic-mlops
spec:
  template:
    spec:
      containers:
        - name: airflow-init
          imagePullPolicy: Always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-webserver
  namespace: traffic-mlops
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: airflow-webserver
          imagePullPolicy: Always
          env:
            - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
              value: "false"
          volumeMounts:
            - name: logs
              mountPath: /opt/airflow/logs
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: airflow-logs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-scheduler
  namespace: traffic-mlops
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: airflow-scheduler
          imagePullPolicy: Always
          env:
            - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
              value: "false"
          volumeMounts:
            - name: logs
              mountPath: /opt/airflow/logs
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: airflow-logs
