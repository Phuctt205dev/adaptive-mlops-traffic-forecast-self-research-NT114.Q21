apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: traffic-mlops
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: mlflow
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
