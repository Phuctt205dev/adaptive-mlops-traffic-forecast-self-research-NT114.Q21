apiVersion: v1
kind: Service
metadata:
  name: traffic-api
  namespace: traffic-mlops
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: null
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-webserver
  namespace: traffic-mlops
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: null
---
apiVersion: v1
kind: Service
metadata:
  name: traffic-web
  namespace: traffic-mlops
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: null
