apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-api
  namespace: traffic-mlops
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: traffic-api
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
