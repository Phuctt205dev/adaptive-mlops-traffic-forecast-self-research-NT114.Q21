apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-web
  namespace: traffic-mlops
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: traffic-web
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
