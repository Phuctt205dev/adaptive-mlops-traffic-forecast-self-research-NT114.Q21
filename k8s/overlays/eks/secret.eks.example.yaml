apiVersion: v1
kind: Secret
metadata:
  name: traffic-secrets
  namespace: traffic-mlops
type: Opaque
stringData:
  POSTGRES_PASSWORD: "replace-with-strong-postgres-password"
  DATABASE_URL: "postgresql+psycopg://traffic:replace-with-strong-postgres-password@postgres:5432/traffic_management"
  MLFLOW_BACKEND_STORE_URI: "postgresql+psycopg2://traffic:replace-with-strong-postgres-password@postgres:5432/mlflow"
  AIRFLOW_SQL_ALCHEMY_CONN: "postgresql+psycopg2://traffic:replace-with-strong-postgres-password@postgres:5432/airflow"
  MINIO_ROOT_USER: "replace-with-minio-user"
  MINIO_ROOT_PASSWORD: "replace-with-strong-minio-password"
  AUTH_SECRET_KEY: "replace-with-a-long-random-auth-secret"
  BOOTSTRAP_ADMIN_PASSWORD: "replace-with-strong-admin-password"
  INTERNAL_TRAINING_TOKEN: "replace-with-a-long-random-internal-token"
  AIRFLOW_SECRET_KEY: "replace-with-a-long-random-airflow-secret"
  AIRFLOW_ADMIN_PASSWORD: "replace-with-strong-airflow-admin-password"
